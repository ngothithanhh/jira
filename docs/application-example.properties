# Copy sang src/main/resources/application.properties nếu checkout chưa có cấu hình.
# Giá trị nhạy cảm lấy từ biến môi trường; không đưa file cấu hình cá nhân vào Git.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jira}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_MODE:validate}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
# Attachment dùng PostgreSQL local, không cần Cloudinary.
app.storage.cloudinary-enabled=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.test-connection=false

# Bật sau khi áp migration 011 và xác minh provider. Brevo đọc BREVO_API_KEY, BREVO_SENDER_EMAIL và BREVO_SENDER_NAME từ môi trường.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:gmail-api}
# Cấu hình Gmail API nếu chọn gmail-api.
app.mail.sender-address=${MAIL_SENDER_ADDRESS:}
app.mail.sender-name=${MAIL_SENDER_NAME:Jira}
app.gmail.token-file=${GMAIL_TOKEN_FILE:}
app.mail.encryption-key=${MAIL_ENCRYPTION_KEY:}
app.mail.key-version=${MAIL_KEY_VERSION:1}

# E1. Khóa ngẫu nhiên riêng 32 byte mã hóa Base64. Bật cleanup sau khi áp migration 012.
app.verification.hmac-key=${VERIFICATION_HMAC_KEY:}
app.verification.cleanup-enabled=true
app.verification.ip-send-limit=30
app.verification.ip-verify-limit=120
app.public-base-url=${APP_PUBLIC_BASE_URL:}
