# Copy sang src/main/resources/application.properties nếu checkout chưa có cấu hình.
# Giá trị nhạy cảm lấy từ biến môi trường; không đưa file cấu hình cá nhân vào Git.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jira}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_MODE:validate}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
# Attachment dùng PostgreSQL local, không cần Cloudinary.
app.storage.cloudinary-enabled=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.test-connection=false

# Gmail API dùng file OAuth local ngoài Git. Bật sau khi áp migration 011 và cấp scope gmail.send.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=gmail-api
app.mail.sender-address=${MAIL_SENDER_ADDRESS:}
app.mail.sender-name=${MAIL_SENDER_NAME:Jira}
app.gmail.token-file=${GMAIL_TOKEN_FILE:}
app.mail.encryption-key=${MAIL_ENCRYPTION_KEY:}
app.mail.key-version=${MAIL_KEY_VERSION:1}
